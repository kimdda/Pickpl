<script>
	var isLogin = false;
	if(sessionStorage.getItem("loginId") != null) {
		isLogin = true;
	}
	$(".stat_menu").click(function() {
		if(isLogin) {
			if($(this).hasClass("active")) {
				$(this).removeClass("active").next().slideUp(200);
			} else {
				$(this).addClass("active").next().slideDown(200);
			}			
		} else {
			alert("로그인 후 이용 가능합니다.");
		}
	});

	$("[data-link]").click(function() {
		if(isLogin) {
			location.href = $(this).attr("data-link");			
		} else {
			alert("로그인 후 이용 가능합니다.");
		}
	});
	
	if($(".diary_wrap").length || $(".diary_detail_wrap").legnth) {
		$(".nav_diary").addClass("selected");
	} else if($(".member_wrap").length || $(".member_detail_wrap").length) {
		$(".nav_member").addClass("selected");
	} else if($(".report_wrap").length || $(".report_detail_wrap").length ) {
		$(".nav_report").addClass("selected");
	} else if($(".reco_wrap").length || $(".new_reco_wrap").length) {
		$(".nav_rcmnd").addClass("selected");
	} else {
		$(".nav_main").addClass("selected");
	}
</script>
