<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="img/icon/favicon.ico">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script>
        var addr = "";
        var lat = "";
        var lag = "";
        $(function() {
            $("#confirmBtn").click(function() {
                window.opener.$("#address").val(addr);
                window.opener.$("#lat").val(lat);
                window.opener.$("#lng").val(lng);
                window.open('','_self').close();
            });
        });
    </script>
    <title>픽 위치 선택</title>
</head>
<body>
<div class="map_search_wrap">
    <div class="search_map_wrap">
		<div id="map" style="width:100%; height:80vh;"></div>
		<p>원하는 장소를 클릭하면 해당 위치의 주소를 확인할 수 있습니다.</p>
		<div class="addr_box">
			<span id="displayAddr">주소</span>	
			<button id="confirmBtn" class="btn">확인</button>		
		</div>
	</div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=218e8fedd2cb6770e181a0e8a08311e7&libraries=services"></script>
<script>
    var mapContainer = document.getElementById('map'), // 지도를 표시할 div 
        mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 지도의 중심좌표
            level: 12 // 지도의 확대 레벨
        };  
    
    // 지도를 생성합니다    
    var map = new kakao.maps.Map(mapContainer, mapOption); 
    
    // 주소-좌표 변환 객체를 생성합니다
    var geocoder = new kakao.maps.services.Geocoder();
    
    var marker = new kakao.maps.Marker(), // 클릭한 위치를 표시할 마커입니다
        infowindow = new kakao.maps.InfoWindow({zindex:1}); // 클릭한 위치에 대한 주소를 표시할 인포윈도우입니다
    
    // 현재 지도 중심좌표로 주소를 검색해서 지도 좌측 상단에 표시합니다
    // searchAddrFromCoords(map.getCenter(), displayCenterInfo);
    
    // 지도를 클릭했을 때 클릭 위치 좌표에 대한 주소정보를 표시하도록 이벤트를 등록합니다
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
    	var region;
    	searchAddrFromCoords(mouseEvent.latLng, function(result, status){
    		if (status === kakao.maps.services.Status.OK) {
	    		region = result[0].region_1depth_name;
    			
		        searchDetailAddrFromCoords(mouseEvent.latLng, function(result, status) {
		            if (status === kakao.maps.services.Status.OK) {
		                addr = !!result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
		                //addr += '<div>지번 주소 : ' + result[0].address.address_name + '</div>';
		                
		                addr = region + addr.substring(addr.indexOf(" "), addr.length);
		    		
		                // 마커를 클릭한 위치에 표시합니다 
		                marker.setPosition(mouseEvent.latLng);
		                marker.setMap(map);
		
		                // 클릭한 위도, 경도 정보를 가져옵니다 
		                var latlng = mouseEvent.latLng; 
		                lat = latlng.getLat();
		                lng = latlng.getLng();
		    
		                // 주소를 displayAddr에 표시
		                var infoDiv = document.getElementById('displayAddr');
		                infoDiv.innerHTML = region + addr.substring(addr.indexOf(" "), addr.length);
		//                 infoDiv.innerHTML = addr;
		            }   
		        });
    		}
    	})
    	
    });
    
    // 중심 좌표나 확대 수준이 변경됐을 때 지도 중심 좌표에 대한 주소 정보를 표시하도록 이벤트를 등록합니다
    /* kakao.maps.event.addListener(map, 'idle', function() {
        searchAddrFromCoords(map.getCenter(), displayCenterInfo);
    }); */
    
    function searchAddrFromCoords(coords, callback) {
        // 좌표로 행정동 주소 정보를 요청합니다
        geocoder.coord2RegionCode(coords.getLng(), coords.getLat(), callback);         
    }
    
    function searchDetailAddrFromCoords(coords, callback) {
        // 좌표로 법정동 상세 주소 정보를 요청합니다
        geocoder.coord2Address(coords.getLng(), coords.getLat(), callback);
    }
    
    // 지도 좌측상단에 지도 중심좌표에 대한 주소정보를 표출하는 함수입니다
    /*function displayCenterInfo(result, status) {
        if (status === kakao.maps.services.Status.OK) {
            var infoDiv = document.getElementById('centerAddr');
    
            for(var i = 0; i < result.length; i++) {
                // 행정동의 region_type 값은 'H' 이므로
                if (result[i].region_type === 'H') {
                    infoDiv.innerHTML = result[i].address_name;
                    break;
                }
            }
        }    
    }*/
    </script>
</body>
</html>
